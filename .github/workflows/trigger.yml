name: Trigger PFRT Quartz Deploy

on:
  workflow_dispatch
  push:
    branches:
      - main 

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Event
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PFRT_PAT }}" \
          https://github.com \
          -d '{"event_type": "dispatch-prft" }' 
